<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ancient Size 3D</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="../styles.css" rel="stylesheet" />
  <link href="globe-styles.css" rel="stylesheet" />
</head>
<body style="background: #000; margin: 0;">
  <div id="globe-container" style="width: 100%; height: 100vh;"></div>

  <div id="layer-controls" class="open">
    <h3 id="toggle-controls">Ancient Size 3D</h3>
    <div id="controls-content">
      <div id="map-controls">
        <input type="text" id="map-search" placeholder="search civilization...">
        <div id="search-results" class="results-list"></div>
      </div>
      <h4>Maps in Globe:</h4>
      <div id="layers-list" style="max-height: 200px; overflow-y: auto;"></div>
      <button onclick="window.location.href='../index.html'" class="back-btn">Back to 2D</button>
    </div>
  </div>

  <script type="module" src="globe.js"></script>
</body>
</html>
